spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      leak-detection-threshold: 60000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  rabbitmq:
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.adtracker.webhookingest: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  file:
    name: /var/log/youtube-webhook-ingestion/application.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB

webhook:
  ingestion:
    validation:
      enabled: true
      strict-mode: true
