spring:
  datasource:
    hikari:
      schema: webhook_ingestion
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: webhook_ingestion
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    schemas: webhook_ingestion
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false

  rabbitmq:
    host: localhost
    port: 5672

logging:
  level:
    root: INFO
    com.adtracker.webhookingest: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
